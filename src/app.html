<!doctype html>
<html lang="en" class="h-full">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta
			name="description"
			content="ResumeForge - a free resume and cover letter builder with live preview, PDF and Word export, and a job match checker. Your data stays in your browser."
		/>
		<meta name="theme-color" content="#1F2933" />
		<script>
			// Apply the saved theme before first paint so there is no flash of the wrong mode.
			try {
				const raw = localStorage.getItem('resumeforge:data:v1');
				const theme = raw ? JSON.parse(raw)?.settings?.theme : 'system';
				const dark =
					theme === 'dark' ||
					((theme === 'system' || !theme) &&
						window.matchMedia('(prefers-color-scheme: dark)').matches);
				if (dark) document.documentElement.classList.add('dark');
			} catch (e) {
				// Storage blocked - fall back to the light interface.
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" class="h-full">
		<div style="display: contents" class="h-full">%sveltekit.body%</div>
	</body>
</html>
